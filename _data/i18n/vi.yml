            tiết.</p>'

# --- Our Story Section ---

# NOT "Người đứng sau Alpha Software", and the reason is a fact about the
# company rather than a matter of taste: Alpha is a two-member company and
# intends to grow (owner, 2026-08-10). A heading that says "the person behind"
# is simply false, and the plural fix — "Những người đứng sau" — would be just
# as wrong the other way, because the section shows one portrait and tells one
# founding story. So the heading counts nobody. It asks where the company came
# from, which is the question the body below actually answers ("thành lập vào
# năm 2021 bởi…"), and it stays true on the day a third name is added.
#
# "…bắt đầu từ đâu" (where did it begin) fixed the false claim but reads like
# an interview question rather than the opening of a story — and the section's
# own toc entry is "Về chúng tôi" (About us), a narrative frame, not an
# interrogative one. "…ra đời như thế nào" (how it came to be) keeps counting
# nobody and reads as the start of the story the body then tells (owner's
# choice on a second pass, 2026-08-10).
our_story_title: "Alpha Software ra đời như thế nào"
founder_title: "Nhà sáng lập"

our_story_body: '<p class="mt-md-0">
          Alpha Software được thành lập vào năm 2021 bởi Ông Phan Đức Tuấn Anh,
          người có hơn 28 năm kinh nghiệm thực tiễn trong lĩnh vực dệt
          may – trong đó có 13 năm là kỹ thuật viên nhuộm và 15 năm làm Giám đốc
          nhà máy. Với nền tảng vững chắc về Hoá học Hữu cơ cùng sự hiểu biết
          sâu sắc về quản lý nhà máy và phát triển phần mềm, ông Tuấn Anh đã
          giúp chúng tôi cung cấp các giải pháp công nghệ thực tiễn đáp ứng nhu
          cầu của các doanh nghiệp dệt may hiện đại.
        </p>'

# --- Support Section ---

# "Gọi trực tiếp cho người sáng lập" was meant as an offer and worked as a
# barrier: it asks the reader to disturb an important person, and the owner
# read the whole line as arrogant besides (2026-08-10). The reader hesitates
# for a reason no button label can argue away.
#
# So the heading no longer says WHO answers; it says what the call costs, which
# is nothing. The reassurance that made "the founder" worth mentioning has
# moved into the sentence below and been turned the other way round: the point
# is not that you get someone important, it is that you do not get a script.
# Same fact, no pressure.
support_title: "Gọi cho chúng tôi để được tư vấn miễn phí"
support_call_prompt: "Hãy gọi"
# Reads as one sentence with the number between the two halves.
#
# The first version of the reassurance clause — "không phải nhân viên tổng
# đài" — defined the person by what they are NOT, which reads a little
# defensive (as if a call center were the expectation to argue down). This
# version states what they ARE and does for you instead: 28 years of hands-on
# dyeing experience, so the reader's actual problem gets understood on the
# first sentence rather than after a disclaimer.
#
# "vấn đề của bạn" keeps its "của bạn" on purpose — this is not the calque
# that got "tại xưởng của bạn" and "câu hỏi của bạn" rewritten elsewhere.
# Those were a postposed possessive doing the job English "your" does and
# Vietnamese normally does not; "của bạn" as the object of "hiểu vấn đề" is
# the ordinary, idiomatic construction ("hiểu vấn đề của bạn" is how anyone
# would say "understand your problem"). The rule was never "delete của bạn",
# it was "don't let của bạn do double duty as a location marker".
support_email_prompt: "– người trực tiếp trả lời có 28 năm kinh nghiệm nhuộm, hiểu ngay vấn đề của bạn. Hoặc gửi câu hỏi qua"
support_cta: "Gửi email đến Alpha Software"

