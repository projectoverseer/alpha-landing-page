# The homepage's Chia sẻ kinh nghiệm section (_includes/knowledge.html), the
# last block of <main>. Vietnamese-only for the same reason as the keys below:
# the include renders nothing at all unless `toc_knowledge` exists, so /en/
# never reaches these and they need no English twin.
# Deliberately NOT "chia-se-kinh-nghiem": that string is already the hub's URL
# path, and a section id that reads identically to a path on the same site is a
# trap for whoever next writes a link and cannot tell from the text whether
# they meant /chia-se-kinh-nghiem/ or /#chia-se-kinh-nghiem.
toc_knowledge_id: "kien-thuc"
knowledge_title: "Chia sẻ kinh nghiệm"
# The lead was a credential stack — the founder's name, 28 years, 13 years, 15
# years — which is the library's justification, not its offer. It also broke
# the name across a line, which is the thing the owner will not have anywhere
# on the site.
#
# What it says now is what makes a reader open one: these are mistakes we made
# and fixed on the floor, they cost nothing, and there is a new one every week.
# "đã đo, đã sai và đã sửa" is the author's own line from his bio — admitting
# the mistakes is what makes 28 years read as generosity rather than as rank.
# The credentials still exist, on the hub and on the author page, where a
# reader who wants them goes looking.
knowledge_lead: "Những gì chúng tôi đã đo, đã sai và đã sửa ngay trên sàn xưởng, viết lại để bạn dùng được ngay. Miễn phí, bài mới mỗi Chủ nhật."
knowledge_topics_label: "Đọc theo chủ đề"
# The rail's accessible name. It used to be a visible <h3> over the list; the
# three cards say "articles" without being told, and on a page this long a
# heading that adds nothing costs a line the contact section below it needs.
knowledge_latest_label: "Bài viết mới nhất"
# The card's second line: topic · reading time. The minutes are here for the
# same reason YouTube stamps a duration on every thumbnail — a reader decides
# whether to click by weighing interest against cost, and a cost they cannot
# see is assumed to be high. Ours are mostly five to seven minutes, which is
# an argument FOR clicking, so it is stated.
knowledge_minutes: "%d phút đọc"
# %d is the live post count, substituted in knowledge.html.
knowledge_all: "Xem tất cả %d bài viết"

