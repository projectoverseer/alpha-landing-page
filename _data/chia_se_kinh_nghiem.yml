# Data for the Chia sẻ kinh nghiệm hub (/chia-se-kinh-nghiem/) — topics, series, author.
# Design reference: design/chia-se-kinh-nghiem/01-philosophy.md

author:
  name: "Phan Đức Tuấn Anh"
  role: "Nhà sáng lập Alpha Software"
  # Slug for the author page (/chia-se-kinh-nghiem/tac-gia/<slug>/) and the file
  # slug of the portrait in img/portraits/ (a -2x.jpg sibling exists too).
  slug: "phan-duc-tuan-anh"
  portrait: "chan-dung-ong-phan-duc-tuan-anh"
  # Shown on the author page's intro card and used as its meta description.
  bio: >-
    Nhà sáng lập Alpha Software, với hơn 28 năm gắn bó với ngành dệt nhuộm –
    13 năm làm kỹ thuật viên nhuộm và 15 năm làm giám đốc nhà máy. Anh viết
    loạt bài này từ chính những gì đã đo, đã sai và đã sửa ngay trên sàn xưởng.

# Hub sections, in display order. Posts declare `topic: <key>` in front matter.
topics:
  van-hanh:
    label: "Vận hành & hiệu suất"
    desc: "Đo lường và cải thiện OEE, RFT – thêm doanh thu và lợi nhuận từ chính số máy đang có."
  ky-thuat-nhuom:
    label: "Kỹ thuật nhuộm"
    desc: "Phân tích lỗi nhuộm thường gặp và cách xử lý tận gốc, từ kinh nghiệm sản xuất thực tế."
  do-mau:
    label: "Màu sắc & đo màu"
    desc: "Lý thuyết màu sắc, máy quang phổ và quy trình so màu chuẩn giữa nhà máy và khách hàng."

# Series metadata. Posts declare `series: <key>` + `series_part: n`.
# Each series also has a page (/chia-se-kinh-nghiem/series/<key>/) that lists
# its parts in reading order; `desc` is that page's standfirst and meta description.
series:
  so-hoa-oee:
    label: "Số hóa OEE trong xưởng nhuộm"
    desc: "Từ con số OEE 60% đến cách đo và số hóa từng thành phần – loạt bài giúp xưởng nhuộm tìm lại số giờ máy đang thất thoát mỗi ngày."
  ly-thuyet-mau-sac:
    label: "Lý thuyết màu sắc trong ngành nhuộm"
    desc: "Ánh sáng, nguyên lý máy quang phổ, các giá trị L*a*b* và quy trình hiệu chuẩn – nền tảng để so màu chuẩn giữa nhà máy và khách hàng."
  spandex:
    label: "Spandex trong dệt nhuộm"
    desc: "Từ công nghệ chế tạo sợi spandex, cách đưa sợi vào dệt thoi và dệt kim, đến quy trình 5 bước xử lý trong xưởng nhuộm – mặt hàng lợi nhuận cao nhưng rủi ro lỗi gia công rất lớn."

# Image library for the hub. One entry per picture, keyed by its file slug in
# img/chia-se-kinh-nghiem/ — the alt text, caption and intrinsic size live here
# so a post only ever names the slug (front matter `image:` for the thumbnail,
# or the figure include in the body), and every render of the same picture
# stays consistent.
#
#   w/h  = the LARGEST derivative that ships (also what <img> width/height say)
#   sm   = a 672px derivative exists too, so the srcset has something to choose
#   fx/fy = the image's attention centre, as percent of width/height — computed
#          by image-focus.mjs (sharp's saliency strategy, the static-site
#          analog of how Facebook centres a crop). Every cropped rendering
#          (feed clamp, split cell, read-next row) keeps this point in frame.
#          Overridable by hand for symmetric continua — spectra, gradients,
#          timelines — where the whole run is the story (design 04 §3);
#          always say so in a comment next to the value.
#   alt  = what the picture says, for a reader who cannot see it (never keyword
#          stuffing — Google penalises that, and it fails the reader anyway)
images:
