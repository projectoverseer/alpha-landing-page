<section class="bg-dark" id="{{ t.toc_our_story_id }}">
  <div class="container">
    <h2 class="mx-auto text-center">{{ t.our_story_title }}</h2>
  </div>
  <div class="hr mt-4" role="presentation"></div>
  <div class="container mt-5">
    <div class="row align-items-start">
      <div class="col-md-5 col-12 text-center">
        <figure class="mx-auto me-md-0 my-0">
          <img
            alt="{{ t.male_title }} Phan Đức Tuấn Anh"
            class="client-portrait"
            height="336"
            loading="lazy"
            src="{{ site.url }}/img/portraits/chan-dung-ong-phan-duc-tuan-anh.jpg"
            srcset="
              {{ site.url }}/img/portraits/chan-dung-ong-phan-duc-tuan-anh.jpg    1x,
              {{ site.url }}/img/portraits/chan-dung-ong-phan-duc-tuan-anh-2x.jpg 2x
            "
            width="252"
          />
          <figcaption>
            {%- comment -%}
              The name that started the rule: "Ông Phan / Đức Tuấn Anh" is the
              break the owner will not have (2026-08-10). `.name` is nowrap —
              see _base.scss for why a CSS class and not `&nbsp;`.
            {%- endcomment -%}
            <span class="name">{{ t.male_title }} <span lang="vi">Phan Đức Tuấn Anh</span></span>,<br />
            {{ t.founder_title }} {{ t.of }} Alpha Software
          </figcaption>
        </figure>
      </div>
      <div class="prose col-md-7 col-12">{{ t.our_story_body }}</div>
    </div>
  </div>
</section>
