<!-- Preload LCP hero image so the browser discovers it before CSS is parsed.
     The candidates MUST mirror the `image-set()` in _sass/_base.scss exactly —
     1920 at 1x, 3840 at 2x — or the preload fetches an image the CSS then
     declines to use. With a bare `href` to the 1x file this preloaded 1920.avif
     on every device while a 2dppx screen (i.e. every phone and every retina
     laptop) went on to paint 3840.avif: one wasted download, and the image that
     actually IS the LCP never preloaded at all — the exact failure this tag was
     added to prevent. `href` stays as the fallback for engines that don't
     support imagesrcset; where both are understood, imagesrcset wins.
     Same rule the reading hub already states in chia-se-kinh-nghiem/head.html:
     start the winning candidate, "and never a second, wasted one". -->
<link
  as="image"
  fetchpriority="high"
  href="{{ site.url }}/img/hero/hero-1920.avif"
  imagesrcset="{{ site.url }}/img/hero/hero-1920.avif 1x, {{ site.url }}/img/hero/hero-3840.avif 2x"
  rel="preload"
  type="image/avif"
/>

<!-- Self-hosted Inter — the @font-face rules ship in main.css (see
     _sass/_fonts.scss), so no font stylesheet request and no third-party
     connection to fonts.googleapis.com / fonts.gstatic.com (also closes the
     GDPR IP-leak that the regional Consent Mode in page.html cares about).
     These preloads kick off the most-used subset right away so the swap from
     the system fallback is fast. latin covers ASCII on every page; vi pages
     (the default locale) also preload the vietnamese subset. -->
<link
  as="font"
  crossorigin="anonymous"
  href="{{ site.url }}/fonts/inter/inter-latin.woff2"
  rel="preload"
  type="font/woff2"
/>
{% if page.lang == "vi" %}
<link
  as="font"
  crossorigin="anonymous"
  href="{{ site.url }}/fonts/inter/inter-vietnamese.woff2"
  rel="preload"
  type="font/woff2"
/>
{% endif %}
<link
  href="{{ site.url }}/apple-touch-icon.png"
  rel="apple-touch-icon"
  sizes="180x180"
/>
<link
  href="{{ site.url }}/favicon.svg"
  rel="icon"
  sizes="any"
  type="image/svg+xml"
/>
<link
  href="{{ site.url }}/favicon-32x32.png"
  rel="icon"
  sizes="32x32"
  type="image/png"
/>
<link
  href="{{ site.url }}/favicon-16x16.png"
  rel="icon"
  sizes="16x16"
  type="image/png"
/>
<link href="{{ site.url }}/site.webmanifest" rel="manifest" />
